services:
  - type: web
    name: whatsapp-ai-bot
    env: node
    buildCommand: "npm install && cd dashboard && npm install && npm run build && cd .. && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VERIFY_TOKEN
        sync: false
